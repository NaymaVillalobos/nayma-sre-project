services:

  nayma-booking-api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    image: nayma-sre-project:1.0.0

    container_name: nayma-booking-api

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DATABASE_PATH: "/tmp/nayma_appointments.db"

    networks:
      - nayma-sre-network

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: nayma-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - nayma-sre-network

    depends_on:
      - nayma-booking-api

    restart: unless-stopped

networks:
  nayma-sre-network:
    driver: bridge